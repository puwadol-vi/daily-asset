<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBands BO [LuxAlgo] — Backtest</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --border: #2a2e3a;
    --text: #e6e8ef;
    --muted: #8b90a0;
    --up: #ffffff;
    --down: #ffffff;
    --entry-long: #22c55e;
    --exit-long: #0ea5e9;
    --entry-short: #ef4444;
    --exit-short: #eab308;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size: 14px;
  }
  h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
  }
  .header-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .header-controls select {
    background: #0d0f16;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
  }
  .indicator-select { position: relative; }
  .indicator-select-btn {
    background: #0d0f16;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
  }
  .indicator-select-panel {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 4px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px;
    min-width: 240px;
    z-index: 20;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .indicator-select-panel.open { display: block; }
  .indicator-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text);
  }
  .indicator-option:hover { background: #1f2330; }
  .indicator-option.locked { cursor: default; color: var(--muted); }
  .indicator-option.locked:hover { background: transparent; }
  .plan-link {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    text-decoration: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
  }
  .plan-link:hover { background: #1f2330; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: flex-end;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  select, input[type=number] {
    background: #0d0f16;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
    min-width: 150px;
  }
  input[type=number] { min-width: 110px; }

  .legend {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    padding: 10px 18px;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  .chart-row {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: #0b0d13;
  }
  .axis-col {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--border);
    order: 1;
  }
  .chart-wrap { overflow-x: auto; flex: 1 1 auto; position: relative; }
  .chart-inner { display: block; }
  .panel { position: relative; }
  canvas { display: block; }
  .chart-inner canvas { cursor: crosshair; }
  .overlay { position: absolute; top: 0; left: 0; pointer-events: none; }

  .corner-spacer { flex: 0 0 auto; }

  .summary { padding: 18px; }
  .stat-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    min-width: 130px;
  }
  .stat-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .stat-card .value { font-size: 18px; font-weight: 600; margin-top: 2px; }
  .stat-card.book-long { border-left: 3px solid var(--entry-long); }
  .stat-card.book-short { border-left: 3px solid var(--entry-short); }

  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; }
  tr:hover td { background: rgba(255,255,255,0.03); }
  .pos { color: #4ade80; }
  .neg { color: #f87171; }
  .side-long { color: var(--entry-long); font-weight: 600; }
  .side-short { color: var(--entry-short); font-weight: 600; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
</style>

<div class="chart-row">
  <div class="chart-wrap" id="chartWrap">

<script>
const BITS = {
  GREEN_GO_POS:  1 << 0,
  RED_GO_POS:    1 << 1,
  CROSS_UP:      1 << 2,
  CROSS_DOWN:    1 << 3,
  RED_PEAK:      1 << 4,
  GREEN_PEAK:    1 << 5,
  GREEN_GO_ZERO: 1 << 6,
  RED_GO_ZERO:   1 << 7,
};

const LENGTHS = [7, 8, 9, 10, 11, 12, 13, 14];
const MULTS = [0.10, 0.15, 0.20, 0.25, 0.30];
const COINS = [
  { value: 'btc', label: 'BTC/USDT' },
  { value: 'eth', label: 'ETH/USDT' },
];
const INDICATORS = [
  { value: 'bbands_bo', label: 'BBands BO [LuxAlgo]', locked: true },
  { value: 'nw_envelope', label: 'Nadaraya-Watson Envelope [LuxAlgo]' },
];

const ENTRY_RULES = [
  { id: 1, label: 'Momentum flips from zero', longBit: BITS.GREEN_GO_POS, shortBit: BITS.RED_GO_POS },
  { id: 2, label: 'Line crosses over',        longBit: BITS.CROSS_UP,     shortBit: BITS.CROSS_DOWN },
  { id: 3, label: 'Opposing line peaks',      longBit: BITS.RED_PEAK,    shortBit: BITS.GREEN_PEAK },
];
const EXIT_RULES = [
  { id: 1, label: 'Own line peaks',                  longBit: BITS.GREEN_PEAK,    shortBit: BITS.RED_PEAK },
  { id: 2, label: 'Line crosses back',                longBit: BITS.CROSS_DOWN,   shortBit: BITS.CROSS_UP },
  { id: 3, label: 'Own line returns to zero',         longBit: BITS.GREEN_GO_ZERO, shortBit: BITS.RED_GO_ZERO },
  { id: 4, label: 'Opposing line flips from zero',    longBit: BITS.RED_GO_POS,   shortBit: BITS.GREEN_GO_POS },
];

const PX_PER_BAR = 8;
const AXIS_WIDTH = 56;
const CANDLE_HEIGHT = 520;
const INDICATOR_HEIGHT = 170;
const VOLUME_HEIGHT = 100;
const DATE_AXIS_HEIGHT = 24;
const PANEL_HEIGHTS = [CANDLE_HEIGHT, INDICATOR_HEIGHT, VOLUME_HEIGHT];

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const header = lines[0].split(',');
  const rows = lines.slice(1).map(l => l.split(','));
  return { header, rows };
}

function col(parsed, name, parser) {
  const idx = parsed.header.indexOf(name);
  if (idx === -1) throw new Error(`column not found: ${name}`);
  return parsed.rows.map(r => {
    const v = r[idx];
    if (v === undefined || v === '') return null;
    return parser ? parser(v) : v;
  });
}

function fmtMoney(v) { return v.toLocaleString(undefined, { maximumFractionDigits: 2 }); }
function fmtPct(v) { return `${v >= 0 ? '+' : ''}${v.toFixed(2)}%`; }

function computeHeikinAshi(opens, highs, lows, closes) {
  const n = closes.length;
  const haOpen = new Array(n), haHigh = new Array(n), haLow = new Array(n), haClose = new Array(n);
  for (let i = 0; i < n; i++) {
    haClose[i] = (opens[i] + highs[i] + lows[i] + closes[i]) / 4;
    haOpen[i] = i === 0 ? (opens[i] + closes[i]) / 2 : (haOpen[i - 1] + haClose[i - 1]) / 2;
    haHigh[i] = Math.max(highs[i], haOpen[i], haClose[i]);
    haLow[i] = Math.min(lows[i], haOpen[i], haClose[i]);
  }
  return { open: haOpen, high: haHigh, low: haLow, close: haClose };
}

// Nadaraya-Watson Envelope [LuxAlgo] — precomputed in Python
// (generate_raw_data.py) into the nw_upper/nw_lower columns of
// data_{coin}_raw.csv. See bbands/Nadaraya-Watson.txt for the spec.
function drawNadarayaWatson(ctx, upperVals, lowerVals, scale) {
  const n = upperVals.length;

  function drawSeries(values, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    let started = false;
    for (let i = 0; i < n; i++) {
      const v = values[i];
      if (v === null) { started = false; continue; }
      const x = i * PX_PER_BAR + PX_PER_BAR / 2;
      const y = scale(v);
      if (!started) { ctx.moveTo(x, y); started = true; } else { ctx.lineTo(x, y); }
    }
    ctx.stroke();
  }

  drawSeries(upperVals, '#14b8a6');
  drawSeries(lowerVals, '#f87171');
}

function simulateBook(side, entryBit, exitBit, masks, closes, dates, initialCapital) {
  let capital = initialCapital;
  let peak = initialCapital;
  let position = null;
  const trades = [];

  for (let i = 0; i < masks.length; i++) {
    const m = masks[i];
    if (m === null) continue;

    if (position) {
      if ((m & exitBit) !== 0) {
        const exitPrice = closes[i];
        const pct = side === 'long'
          ? (exitPrice - position.entryPrice) / position.entryPrice
          : (position.entryPrice - exitPrice) / position.entryPrice;
        const beforeCapital = capital;
        capital *= (1 + pct);
        peak = Math.max(peak, capital);
        trades.push({
          side,
          entryIndex: position.entryIndex,
          entryDate: dates[position.entryIndex],
          entryPrice: position.entryPrice,
          exitIndex: i,
          exitDate: dates[i],
          exitPrice,
          pct: pct * 100,
          beforeCapital,
          capital,
          drawdown: (capital - peak) / peak * 100,
        });
        position = null;
      }
    }

    if (!position) {
      if ((m & entryBit) !== 0) {
        position = { entryIndex: i, entryPrice: closes[i] };
      }
    }
  }
  return trades;
}

function computeStats(trades, initialCapital) {
  if (!trades.length) {
    return { count: 0, winRate: 0, totalReturnPct: 0, maxDrawdownPct: 0, finalCapital: initialCapital };
  }
  const wins = trades.filter(t => t.pct > 0).length;
  const finalCapital = trades[trades.length - 1].capital;
  const maxDrawdownPct = Math.min(0, ...trades.map(t => t.drawdown));
  return {
    count: trades.length,
    winRate: wins / trades.length * 100,
    totalReturnPct: (finalCapital / initialCapital - 1) * 100,
    maxDrawdownPct,
    finalCapital,
  };
}

function getVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function drawGrid(ctx, width, height, numH, vStep) {
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  for (let g = 1; g < numH; g++) {
    const y = height * (g / numH);
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
    ctx.stroke();
  }
  for (let x = 0; x < width; x += vStep) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, height);
    ctx.stroke();
  }
}

function computeLogScale(highs, lows, height) {
  const validHighs = highs.filter(v => v !== null);
  const validLows = lows.filter(v => v !== null);
  const yMax = Math.max(...validHighs) * 1.04;
  const yMin = Math.min(...validLows) / 1.04;
  const logMin = Math.log(yMin);
  const logMax = Math.log(yMax);
  const scale = v => height - ((Math.log(v) - logMin) / (logMax - logMin)) * height;
  return { scale, logMin, logMax };
}

function drawLine(ctx, values, yScale, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  let started = false;
  for (let i = 0; i < values.length; i++) {
    const v = values[i];
    if (v === null) { started = false; continue; }
    const x = i * PX_PER_BAR + PX_PER_BAR / 2;
    const y = yScale(v);
    if (!started) { ctx.moveTo(x, y); started = true; } else { ctx.lineTo(x, y); }
  }
  ctx.stroke();
}

function drawPricePanel(ctx, o, h, l, c, mode) {
  const n = c.length;
  const width = n * PX_PER_BAR;
  const { scale, logMin, logMax } = computeLogScale(h, l, CANDLE_HEIGHT);

  ctx.clearRect(0, 0, width, CANDLE_HEIGHT);
  drawGrid(ctx, width, CANDLE_HEIGHT, 6, PX_PER_BAR * 13);

  if (mode === 'line') {
    drawLine(ctx, c, scale, getVar('--up'));
  } else {
    for (let i = 0; i < n; i++) {
      if (c[i] === null) continue;
      const x = i * PX_PER_BAR + PX_PER_BAR / 2;
      const isUp = c[i] >= o[i];
      const color = isUp ? getVar('--up') : getVar('--down');
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x, scale(h[i]));
      ctx.lineTo(x, scale(l[i]));
      ctx.stroke();
      const bw = PX_PER_BAR * 0.6;
      const yO = scale(o[i]), yC = scale(c[i]);
      const top = Math.min(yO, yC);
      const barH = Math.max(Math.abs(yO - yC), 1);
      ctx.fillRect(x - bw / 2, top, bw, barH);
    }
  }
  return { scale, logMin, logMax };
}

function drawPriceAxis(ctx, logMin, logMax, height) {
  ctx.clearRect(0, 0, AXIS_WIDTH, height);
  const numTicks = 6;
  ctx.font = '10px sans-serif';
  ctx.fillStyle = 'rgba(230,232,239,0.6)';
  ctx.textAlign = 'right';
  for (let g = 1; g <= numTicks; g++) {
    const price = Math.exp(logMin + (logMax - logMin) * (g / numTicks));
    const y = height - (g / numTicks) * height;
    const label = price >= 1000 ? price.toFixed(0) : price.toFixed(2);
    ctx.fillText(label, AXIS_WIDTH - 6, y + 3);
  }
  ctx.textAlign = 'left';
}

function drawLinearAxis(ctx, height, maxValue, ticks) {
  ctx.clearRect(0, 0, AXIS_WIDTH, height);
  ctx.font = '10px sans-serif';
  ctx.fillStyle = 'rgba(230,232,239,0.6)';
  ctx.textAlign = 'right';
  for (let g = 0; g <= ticks; g++) {
    const v = maxValue * (g / ticks);
    const y = height - (g / ticks) * height;
    const label = v >= 1000 ? Math.round(v).toLocaleString() : v.toFixed(0);
    ctx.fillText(label, AXIS_WIDTH - 6, y + 3);
  }
  ctx.textAlign = 'left';
}

function invPriceScale(y, height, logMin, logMax) {
  const frac = (height - y) / height;
  return Math.exp(logMin + frac * (logMax - logMin));
}

function invLinearScale(y, height, maxValue) {
  return ((height - y) / height) * maxValue;
}

function fmtPriceLabel(v) {
  return v >= 1000 ? v.toFixed(0) : v.toFixed(2);
}

function drawCrosshairLabelBox(ctx, width, height, boxW, boxH, left, top, text) {
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = '#1c202c';
  ctx.fillRect(left, top, boxW, boxH);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.strokeRect(left + 0.5, top + 0.5, boxW - 1, boxH - 1);
  ctx.fillStyle = '#e6e8ef';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(text, left + boxW / 2, top + boxH / 2 + 3);
  ctx.textAlign = 'left';
}

function drawPriceCrosshairLabel(ctx, height, y, text) {
  const boxH = 18;
  const top = Math.min(Math.max(y - boxH / 2, 0), height - boxH);
  drawCrosshairLabelBox(ctx, AXIS_WIDTH, height, AXIS_WIDTH, boxH, 0, top, text);
}

function drawDateCrosshairLabel(ctx, width, x, text) {
  const boxW = 64;
  const left = Math.min(Math.max(x - boxW / 2, 0), width - boxW);
  drawCrosshairLabelBox(ctx, width, DATE_AXIS_HEIGHT, boxW, DATE_AXIS_HEIGHT - 4, left, 2, text);
}

function drawIndicatorPanel(ctx, bulls, bears, dates) {
  const n = bulls.length;
  const width = n * PX_PER_BAR;
  ctx.clearRect(0, 0, width, INDICATOR_HEIGHT);
  drawGrid(ctx, width, INDICATOR_HEIGHT, 5, PX_PER_BAR * 13);
  const yScale = v => INDICATOR_HEIGHT - (v / 100) * INDICATOR_HEIGHT;

  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(0, yScale(50));
  ctx.lineTo(width, yScale(50));
  ctx.stroke();
  ctx.setLineDash([]);

  drawLine(ctx, bulls, yScale, getVar('--entry-long'));
  drawLine(ctx, bears, yScale, getVar('--entry-short'));
}

function drawDateAxis(ctx, dates) {
  const n = dates.length;
  const width = n * PX_PER_BAR;
  ctx.clearRect(0, 0, width, DATE_AXIS_HEIGHT);
  ctx.fillStyle = 'rgba(230,232,239,0.6)';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'left';
  const step = Math.max(1, Math.round(n / 40));
  for (let i = 0; i < n; i += step) {
    if (!dates[i]) continue;
    ctx.fillText(dates[i].slice(0, 7), i * PX_PER_BAR, 15);
  }
}

function drawVolumePanel(ctx, volumes, opens, closes) {
  const n = volumes.length;
  const width = n * PX_PER_BAR;
  const valid = volumes.filter(v => v !== null);
  const maxV = Math.max(...valid) * 1.05;
  ctx.clearRect(0, 0, width, VOLUME_HEIGHT);
  drawGrid(ctx, width, VOLUME_HEIGHT, 4, PX_PER_BAR * 13);
  const yScale = v => VOLUME_HEIGHT - (v / maxV) * VOLUME_HEIGHT;

  for (let i = 0; i < n; i++) {
    if (volumes[i] === null) continue;
    const x = i * PX_PER_BAR + PX_PER_BAR / 2;
    const isUp = closes[i] >= opens[i];
    ctx.fillStyle = isUp ? getVar('--up') : getVar('--down');
    const bw = PX_PER_BAR * 0.6;
    const y = yScale(volumes[i]);
    ctx.fillRect(x - bw / 2, y, bw, VOLUME_HEIGHT - y);
  }
}

function drawMarkers(ctx, trades, height) {
  for (const t of trades) {
    const entryColor = t.side === 'long' ? 'rgba(34,197,94,0.5)' : 'rgba(239,68,68,0.5)';
    const exitColor = t.side === 'long' ? 'rgba(14,165,233,0.65)' : 'rgba(234,179,8,0.65)';
    const xEntry = t.entryIndex * PX_PER_BAR + PX_PER_BAR / 2;
    const xExit = t.exitIndex * PX_PER_BAR + PX_PER_BAR / 2;
    ctx.fillStyle = entryColor;
    ctx.fillRect(xEntry - 1, 0, 2, height);
    ctx.fillStyle = exitColor;
    ctx.fillRect(xExit - 1, 0, 2, height);
  }
}

function renderStats(trades, initialCapital, side) {
  const statRow = document.getElementById('statRow');
  statRow.innerHTML = '';

  function card(titlePrefix, stats, bookClass) {
    const items = [
      ['Trades', stats.count],
      ['Win Rate', fmtPct(stats.winRate)],
      ['Total Return', fmtPct(stats.totalReturnPct)],
      ['Max Drawdown', fmtPct(stats.maxDrawdownPct)],
      ['Final Capital', fmtMoney(stats.finalCapital)],
    ];
    return items.map(([label, value]) => `
      <div class="stat-card ${bookClass}">
        <div class="label">${titlePrefix ? titlePrefix + ' — ' : ''}${label}</div>
        <div class="value">${value}</div>
      </div>`).join('');
  }

  if (side === 'both') {
    const longTrades = trades.filter(t => t.side === 'long');
    const shortTrades = trades.filter(t => t.side === 'short');
    statRow.innerHTML =
      card('Long', computeStats(longTrades, initialCapital), 'book-long') +
      card('Short', computeStats(shortTrades, initialCapital), 'book-short');
  } else {
    statRow.innerHTML = card('', computeStats(trades, initialCapital), '');
  }
}

function renderTable(trades) {
  const wrap = document.getElementById('tableWrap');
  if (!trades.length) {
    wrap.innerHTML = '<div class="empty">No trades for this combination.</div>';
    return;
  }
  const showSide = trades.some(t => t.side === 'short') && trades.some(t => t.side === 'long');
  const rows = trades.map(t => `
    <tr>
      ${showSide ? `<td class="side-${t.side}">${t.side.toUpperCase()}</td>` : ''}
      <td>${t.entryDate}</td>
      <td>${fmtMoney(t.entryPrice)}</td>
      <td>${t.exitDate}</td>
      <td>${fmtMoney(t.exitPrice)}</td>
      <td class="${t.pct >= 0 ? 'pos' : 'neg'}">${fmtPct(t.pct)}</td>
      <td>${fmtMoney(t.beforeCapital)}</td>
      <td>${fmtMoney(t.capital)}</td>
      <td class="${t.drawdown < 0 ? 'neg' : ''}">${fmtPct(t.drawdown)}</td>
    </tr>`).join('');
  wrap.innerHTML = `
    <table>
      <thead><tr>
        ${showSide ? '<th>Side</th>' : ''}
        <th>Entry Date</th><th>Entry Price</th>
        <th>Exit Date</th><th>Exit Price</th>
        <th>% Change</th><th>Before Capital</th><th>Capital</th><th>% Drawdown</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

async function main() {
  const state = {};

  const lengthSel = document.getElementById('length');
  const multSel = document.getElementById('mult');
  const entrySel = document.getElementById('entryRule');
  const exitSel = document.getElementById('exitRule');
  const sideSel = document.getElementById('side');
  const capitalInput = document.getElementById('capital');
  const chartTypeSel = document.getElementById('chartType');
  const coinSel = document.getElementById('coinSel');
  const indicatorSelectBtn = document.getElementById('indicatorSelectBtn');
  const indicatorSelectPanel = document.getElementById('indicatorSelectPanel');
  const indicatorSelect = document.getElementById('indicatorSelect');

  LENGTHS.forEach(l => lengthSel.add(new Option(l, l)));
  MULTS.forEach(m => multSel.add(new Option(m.toFixed(2), m)));
  ENTRY_RULES.forEach(r => entrySel.add(new Option(`#${r.id} — ${r.label}`, r.id)));
  EXIT_RULES.forEach(r => exitSel.add(new Option(`#${r.id} — ${r.label}`, r.id)));
  COINS.forEach(c => coinSel.add(new Option(c.label, c.value)));

  const selectedIndicators = new Set(INDICATORS.filter(ind => ind.locked).map(ind => ind.value));

  function updateIndicatorSummary() {
    indicatorSelectBtn.textContent = 'Indicator ▾';
  }

  indicatorSelectPanel.innerHTML = INDICATORS.map(ind => `
    <label class="indicator-option ${ind.locked ? 'locked' : ''}" data-value="${ind.value}">
      <input type="checkbox" ${selectedIndicators.has(ind.value) ? 'checked' : ''} ${ind.locked ? 'disabled' : ''}>
      ${ind.label}
    </label>`).join('');

  indicatorSelectPanel.querySelectorAll('.indicator-option:not(.locked) input').forEach(input => {
    input.addEventListener('change', (e) => {
      const value = e.target.closest('.indicator-option').dataset.value;
      if (e.target.checked) selectedIndicators.add(value); else selectedIndicators.delete(value);
      updateIndicatorSummary();
      render();
    });
  });

  indicatorSelectBtn.addEventListener('click', () => {
    indicatorSelectPanel.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (!indicatorSelect.contains(e.target)) indicatorSelectPanel.classList.remove('open');
  });

  updateIndicatorSummary();

  const candleCanvas = document.getElementById('candleCanvas');
  const indicatorCanvas = document.getElementById('indicatorCanvas');
  const volumeCanvas = document.getElementById('volumeCanvas');
  const candleOverlay = document.getElementById('candleOverlay');
  const indicatorOverlay = document.getElementById('indicatorOverlay');
  const volumeOverlay = document.getElementById('volumeOverlay');
  const candleAxis = document.getElementById('candleAxis');
  const indicatorAxis = document.getElementById('indicatorAxis');
  const volumeAxis = document.getElementById('volumeAxis');
  const candleAxisOverlay = document.getElementById('candleAxisOverlay');
  const indicatorAxisOverlay = document.getElementById('indicatorAxisOverlay');
  const dateAxis = document.getElementById('dateAxis');
  const dateAxisOverlay = document.getElementById('dateAxisOverlay');
  const chartInner = document.getElementById('chartInner');
  const chartWrap = document.getElementById('chartWrap');
  const cornerSpacer = document.getElementById('cornerSpacer');

  cornerSpacer.style.height = `${DATE_AXIS_HEIGHT}px`;

  chartWrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    chartWrap.scrollLeft += e.deltaY;
  }, { passive: false });

  candleAxis.width = AXIS_WIDTH; candleAxis.height = CANDLE_HEIGHT;
  indicatorAxis.width = AXIS_WIDTH; indicatorAxis.height = INDICATOR_HEIGHT;
  volumeAxis.width = AXIS_WIDTH; volumeAxis.height = VOLUME_HEIGHT;
  candleAxisOverlay.width = AXIS_WIDTH; candleAxisOverlay.height = CANDLE_HEIGHT;
  indicatorAxisOverlay.width = AXIS_WIDTH; indicatorAxisOverlay.height = INDICATOR_HEIGHT;

  function resizeCanvases(n) {
    const width = n * PX_PER_BAR;
    [[candleCanvas, CANDLE_HEIGHT], [indicatorCanvas, INDICATOR_HEIGHT], [volumeCanvas, VOLUME_HEIGHT],
     [candleOverlay, CANDLE_HEIGHT], [indicatorOverlay, INDICATOR_HEIGHT], [volumeOverlay, VOLUME_HEIGHT],
     [dateAxis, DATE_AXIS_HEIGHT], [dateAxisOverlay, DATE_AXIS_HEIGHT]]
      .forEach(([canvas, h]) => { canvas.width = width; canvas.height = h; });
  }

  async function loadCoin(coin) {
    const [rawText, procText] = await Promise.all([
      fetch(`data_${coin}_raw.csv`).then(r => {
        if (!r.ok) throw new Error('fetch failed');
        return r.text();
      }),
      fetch(`data_${coin}_process.csv`).then(r => r.text()),
    ]);

    const raw = parseCSV(rawText);
    const proc = parseCSV(procText);
    state.raw = raw;
    state.proc = proc;
    state.dates = col(raw, 'close_date');
    state.opens = col(raw, 'open', parseFloat);
    state.highs = col(raw, 'high', parseFloat);
    state.lows = col(raw, 'low', parseFloat);
    state.closes = col(raw, 'close', parseFloat);
    state.volumes = col(raw, 'volume', parseFloat);
    state.nwUpper = col(raw, 'nw_upper', parseFloat);
    state.nwLower = col(raw, 'nw_lower', parseFloat);
    state.heikin = computeHeikinAshi(state.opens, state.highs, state.lows, state.closes);
    state.n = state.dates.length;
    resizeCanvases(state.n);
  }

  function bullBear(length, mult) {
    const key = `${length}_${mult.toFixed(2)}`;
    return {
      bull: col(state.raw, `bull_${key}`, parseFloat),
      bear: col(state.raw, `bear_${key}`, parseFloat),
    };
  }
  function mask(length, mult) {
    const key = `${length}_${mult.toFixed(2)}`;
    return col(state.proc, key, v => parseInt(v, 10));
  }

  function clearCrosshair() {
    [candleOverlay, indicatorOverlay, volumeOverlay].forEach((canvas, idx) => {
      canvas.getContext('2d').clearRect(0, 0, canvas.width, PANEL_HEIGHTS[idx]);
    });
    candleAxisOverlay.getContext('2d').clearRect(0, 0, AXIS_WIDTH, CANDLE_HEIGHT);
    indicatorAxisOverlay.getContext('2d').clearRect(0, 0, AXIS_WIDTH, INDICATOR_HEIGHT);
    dateAxisOverlay.getContext('2d').clearRect(0, 0, dateAxisOverlay.width, DATE_AXIS_HEIGHT);
  }

  chartInner.addEventListener('mousemove', (e) => {
    const rect = chartInner.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const i = Math.min(state.n - 1, Math.max(0, Math.floor(x / PX_PER_BAR)));
    if (state.closes[i] === null) return;

    const width = state.n * PX_PER_BAR;
    const xCenter = i * PX_PER_BAR + PX_PER_BAR / 2;
    const overlays = [candleOverlay, indicatorOverlay, volumeOverlay];

    let panelIdx = -1, localY = 0, acc = 0;
    for (let p = 0; p < PANEL_HEIGHTS.length; p++) {
      if (y < acc + PANEL_HEIGHTS[p]) { panelIdx = p; localY = y - acc; break; }
      acc += PANEL_HEIGHTS[p];
    }

    overlays.forEach((canvas, idx) => {
      const ctx = canvas.getContext('2d');
      const h = PANEL_HEIGHTS[idx];
      ctx.clearRect(0, 0, width, h);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.setLineDash([2, 3]);
      ctx.beginPath();
      ctx.moveTo(xCenter, 0);
      ctx.lineTo(xCenter, h);
      ctx.stroke();
      if (idx === panelIdx) {
        ctx.beginPath();
        ctx.moveTo(0, localY);
        ctx.lineTo(width, localY);
        ctx.stroke();
      }
      ctx.setLineDash([]);
    });

    const candleAxisCtx = candleAxisOverlay.getContext('2d');
    const indicatorAxisCtx = indicatorAxisOverlay.getContext('2d');
    candleAxisCtx.clearRect(0, 0, AXIS_WIDTH, CANDLE_HEIGHT);
    indicatorAxisCtx.clearRect(0, 0, AXIS_WIDTH, INDICATOR_HEIGHT);

    if (panelIdx === 0 && state.priceLogMin !== undefined) {
      const price = invPriceScale(localY, CANDLE_HEIGHT, state.priceLogMin, state.priceLogMax);
      drawPriceCrosshairLabel(candleAxisCtx, CANDLE_HEIGHT, localY, fmtPriceLabel(price));
    } else if (panelIdx === 1) {
      const value = invLinearScale(localY, INDICATOR_HEIGHT, 100);
      drawPriceCrosshairLabel(indicatorAxisCtx, INDICATOR_HEIGHT, localY, value.toFixed(0));
    }

    drawDateCrosshairLabel(dateAxisOverlay.getContext('2d'), width, xCenter, state.dates[i]);
  });

  chartInner.addEventListener('mouseleave', clearCrosshair);

  function render() {
    const length = parseInt(lengthSel.value, 10);
    const mult = parseFloat(multSel.value);
    const entryRule = ENTRY_RULES.find(r => r.id === parseInt(entrySel.value, 10));
    const exitRule = EXIT_RULES.find(r => r.id === parseInt(exitSel.value, 10));
    const side = sideSel.value;
    const initialCapital = parseFloat(capitalInput.value) || 10000;
    const chartType = chartTypeSel.value;

    const { bull, bear } = bullBear(length, mult);
    const masks = mask(length, mult);

    let trades = [];
    if (side === 'long' || side === 'both') {
      trades = trades.concat(simulateBook('long', entryRule.longBit, exitRule.longBit, masks, state.closes, state.dates, initialCapital));
    }
    if (side === 'short' || side === 'both') {
      trades = trades.concat(simulateBook('short', entryRule.shortBit, exitRule.shortBit, masks, state.closes, state.dates, initialCapital));
    }
    trades.sort((a, b) => a.exitIndex - b.exitIndex);

    const priceSource = chartType === 'heikin'
      ? [state.heikin.open, state.heikin.high, state.heikin.low, state.heikin.close]
      : [state.opens, state.highs, state.lows, state.closes];

    const candleCtx = candleCanvas.getContext('2d');
    const indicatorCtx = indicatorCanvas.getContext('2d');
    const volumeCtx = volumeCanvas.getContext('2d');

    const { scale, logMin, logMax } = drawPricePanel(candleCtx, ...priceSource, chartType);
    state.priceLogMin = logMin;
    state.priceLogMax = logMax;
    drawIndicatorPanel(indicatorCtx, bull, bear, state.dates);
    drawVolumePanel(volumeCtx, state.volumes, state.opens, state.closes);
    drawDateAxis(dateAxis.getContext('2d'), state.dates);

    drawPriceAxis(candleAxis.getContext('2d'), logMin, logMax, CANDLE_HEIGHT);
    drawLinearAxis(indicatorAxis.getContext('2d'), INDICATOR_HEIGHT, 100, 5);
    volumeAxis.getContext('2d').clearRect(0, 0, AXIS_WIDTH, VOLUME_HEIGHT);

    if (selectedIndicators.has('nw_envelope')) {
      drawNadarayaWatson(candleCtx, state.nwUpper, state.nwLower, scale);
    }

    drawMarkers(candleCtx, trades, CANDLE_HEIGHT);
    drawMarkers(indicatorCtx, trades, INDICATOR_HEIGHT);
    drawMarkers(volumeCtx, trades, VOLUME_HEIGHT);

    renderStats(trades, initialCapital, side);
    renderTable(trades);
  }

  [lengthSel, multSel, entrySel, exitSel, sideSel, capitalInput, chartTypeSel].forEach(el =>
    el.addEventListener('change', render)
  );
  coinSel.addEventListener('change', async () => {
    await loadCoin(coinSel.value);
    render();
  });

  await loadCoin(coinSel.value);
  render();
}

main().catch(err => {
  document.body.innerHTML = `<div class="empty" style="padding:40px">
    Failed to load CSV data (${err.message}).<br>
    Browsers block fetch() of local files opened via file://.<br>
    Serve this folder over HTTP instead, e.g.:<br>
    <code>cd bbands && python3 -m http.server 8000</code><br>
    then open http://localhost:8000/index.html
  </div>`;
});
</script>
</body>
</html>
