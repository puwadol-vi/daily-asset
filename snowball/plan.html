<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snowball V10 — SMC BOS/CHoCH — Plan</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --border: #2a2e3a;
    --text: #e6e8ef;
    --muted: #8b90a0;
    --link: #60a5fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  .topbar {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .topbar a { color: var(--link); text-decoration: none; font-size: 13px; }
  .topbar a:hover { text-decoration: underline; }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 20px 80px;
  }
  h1, h2, h3 { font-weight: 600; line-height: 1.3; }
  h1 { font-size: 26px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  h2 { font-size: 20px; margin-top: 36px; }
  h3 { font-size: 16px; margin-top: 24px; }
  p { color: #d3d6e0; }
  code {
    background: #0d0f16;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 0.9em;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  pre {
    background: #0d0f16;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
  }
  pre code { border: none; padding: 0; background: none; }
  table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 13.5px; }
  th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  th { background: var(--panel); color: var(--muted); font-weight: 600; }
  tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
  ul, ol { color: #d3d6e0; padding-left: 24px; }
  hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
  a { color: var(--link); }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
</style>
</head>
<body>

<div class="topbar"><a href="index.html">&larr; back to backtest</a></div>
<main id="content"></main>

<script>
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function inline(text) {
  let s = escapeHtml(text);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  return s;
}

function isSeparatorRow(line) {
  return /^\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?$/.test(line.trim());
}

function splitTableRow(line) {
  return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
}

function mdToHtml(md) {
  const lines = md.replace(/\r\n/g, '\n').split('\n');
  const out = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    if (line.trim() === '') { i++; continue; }

    if (line.startsWith('```')) {
      const body = [];
      i++;
      while (i < lines.length && !lines[i].startsWith('```')) { body.push(lines[i]); i++; }
      i++;
      out.push(`<pre><code>${escapeHtml(body.join('\n'))}</code></pre>`);
      continue;
    }

    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    if (heading) {
      out.push(`<h${heading[1].length}>${inline(heading[2])}</h${heading[1].length}>`);
      i++;
      continue;
    }

    if (/^(-{3,}|_{3,}|\*{3,})$/.test(line.trim())) {
      out.push('<hr>');
      i++;
      continue;
    }

    if (line.trim().startsWith('|') && i + 1 < lines.length && isSeparatorRow(lines[i + 1])) {
      const header = splitTableRow(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith('|')) { rows.push(splitTableRow(lines[i])); i++; }
      out.push('<table><thead><tr>' +
        header.map(c => `<th>${inline(c)}</th>`).join('') +
        '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') +
        '</tbody></table>');
      continue;
    }

    if (/^[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^[-*]\s+/, ''));
        i++;
      }
      out.push('<ul>' + items.map(it => `<li>${inline(it)}</li>`).join('') + '</ul>');
      continue;
    }

    const para = [line];
    i++;
    while (i < lines.length && lines[i].trim() !== '' && !/^(#{1,6})\s|^```|^[-*]\s+|^\|/.test(lines[i])) {
      para.push(lines[i]);
      i++;
    }
    out.push(`<p>${inline(para.join(' '))}</p>`);
  }

  return out.join('\n');
}

fetch('PLAN.md')
  .then(r => {
    if (!r.ok) throw new Error('fetch failed');
    return r.text();
  })
  .then(md => { document.getElementById('content').innerHTML = mdToHtml(md); })
  .catch(err => {
    document.getElementById('content').innerHTML =
      `<div class="empty">Failed to load PLAN.md (${err.message}).<br>Serve this folder over HTTP rather than opening via file://.</div>`;
  });
</script>
</body>
</html>
